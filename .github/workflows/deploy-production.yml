name: Deploy production

on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check production deployment configuration
        id: config
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCTION_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] && [ -n "$VERCEL_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Production deployment is not configured; no deployment was attempted."
          fi
      - name: Deploy to the configured production Vercel project
        if: steps.config.outputs.configured == 'true'
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCTION_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm exec --yes vercel@latest pull -- --yes --environment=production --token="$VERCEL_TOKEN"
          npm exec --yes vercel@latest build -- --prod --token="$VERCEL_TOKEN"
          url="$(npm exec --yes vercel@latest deploy -- --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Health check
        if: steps.config.outputs.configured == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 10 "$DEPLOYMENT_URL"
      - name: Deployment failure guidance
        if: failure()
        run: echo "Health check failed. Configure VERCEL_PREVIOUS_PRODUCTION_DEPLOYMENT_URL and perform a Vercel rollback from that verified deployment."
      - name: Report deployment configuration status
        if: steps.config.outputs.configured != 'true'
        run: |
          echo "Deployment skipped: configure VERCEL_ORG_ID, VERCEL_PRODUCTION_PROJECT_ID, and VERCEL_TOKEN before releasing to production."
