name: Delete merged branches

# Thin caller. Logic in lumina-w/agents (delete-merged-branches.yml).
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the branches that would be deleted without deleting them
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  sweep:
    uses: lumina-w/agents/.github/workflows/delete-merged-branches.yml@v4
    with:
      dry_run: ${{ inputs.dry_run || false }}
