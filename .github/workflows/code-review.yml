name: Automated code review

on:
  push:
    branches: [dev, stg]
  pull_request:
    branches: [dev, stg, main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  static-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Review exposed environment files and hard-coded secrets
        id: review
        run: |
          issues=""
          if git ls-files | grep -Ev '(^|/)\.env\.example$' | grep -Eq '(^|/)\.env($|\.)'; then issues="$issues\n- A tracked .env file was found."; fi
          if rg -n '(OPENAI_API_KEY|NEXTAUTH_SECRET|DATABASE_URL)\s*=\s*["'"'"'][^$][^"'"'"']+' --glob '!*.example' --glob '!package-lock.json' .; then issues="$issues\n- Potential hard-coded secret or connection value found."; fi
          if [ -z "$issues" ]; then issues="\n- No static security or environment exposure findings."; fi
          printf 'body<<EOF\n%s\nEOF\n' "$issues" >> "$GITHUB_OUTPUT"
          if [ "$issues" != "\n- No static security or environment exposure findings." ]; then
            exit 1
          fi
      - name: Report static review
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REVIEW_BODY: ${{ steps.review.outputs.body }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Automated static review\n${process.env.REVIEW_BODY}`,
            });
