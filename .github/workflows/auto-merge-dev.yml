name: Auto-merge feature PRs to dev

on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: "startsWith(github.event.pull_request.head.ref, 'feature/') || startsWith(github.event.pull_request.head.ref, 'fix/') || startsWith(github.event.pull_request.head.ref, 'chore/')"
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.PROMOTE_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
