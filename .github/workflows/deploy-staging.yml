name: Deploy staging

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy to the configured staging Vercel project
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_TOKEN"
          npm exec --yes vercel@latest pull -- --yes --environment=production --token="$VERCEL_TOKEN"
          npm exec --yes vercel@latest build -- --prod --token="$VERCEL_TOKEN"
          url="$(npm exec --yes vercel@latest deploy -- --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Health check
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 10 "$DEPLOYMENT_URL"
      - name: Report staging deployment URL
        if: success()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const prs = await github.rest.pulls.list({ owner: context.repo.owner, repo: context.repo.repo, head: `${context.repo.owner}:dev`, state: 'open' });
            for (const pr of prs.data) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body: `Staging deployed: ${process.env.DEPLOYMENT_URL}` });
            }
