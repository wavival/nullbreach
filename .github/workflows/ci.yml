name: CI

on:
  workflow_dispatch:
  push:
    branches: [dev, stg, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [dev, stg, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Validate work pull request commits
        if: github.base_ref == 'dev'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Validate promotion pull request title
        if: github.base_ref == 'stg' || github.base_ref == 'main'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nullbreach
          NEXTAUTH_SECRET: ci-only-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          OPENAI_API_KEY: sk-ci-placeholder
          OPENAI_MODEL: gpt-5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
      - name: Report result to pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `CI ${process.env.STATUS === 'success' ? 'passed' : 'failed'} for ${context.sha}.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        env:
          STATUS: ${{ job.status }}
