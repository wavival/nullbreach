name: CI

on:
  push:
    branches:
      [
        "feat/**",
        "fix/**",
        "chore/**",
        "docs/**",
        "refactor/**",
        "test/**",
        "ci/**",
        "security/**",
      ]
  pull_request:
    branches: [dev, stg, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nullbreach
          NEXTAUTH_SECRET: ci-only-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          OPENAI_API_KEY: sk-ci-placeholder
          OPENAI_MODEL: gpt-5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
      - name: Report result to pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `CI ${process.env.STATUS === 'success' ? 'passed' : 'failed'} for ${context.sha}.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        env:
          STATUS: ${{ job.status }}
