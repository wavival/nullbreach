name: Bug report
description: Report a reproducible defect.
labels: ["type: bug"]
body:
  - type: textarea
    attributes: { label: Description, description: What happened? }
    validations: { required: true }
  - type: textarea
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    attributes: { label: Expected and actual behavior }
    validations: { required: true }
